<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuoteVerse | Smart Quote Generator</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="app">

    <header>
        <div>
            <h1>Quote<span>Verse</span></h1>
            <p>Your daily dose of inspiration ✨</p>
        </div>

        <button id="themeBtn" class="icon-btn">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>


    <!-- Categories -->

    <div class="categories">

        <button class="category active" data-category="All">
            All
        </button>

        <button class="category" data-category="Motivation">
            Motivation
        </button>

        <button class="category" data-category="Success">
            Success
        </button>

        <button class="category" data-category="Life">
            Life
        </button>

        <button class="category" data-category="Study">
            Study
        </button>

    </div>


    <!-- Quote Card -->

    <main class="quote-card">

        <div class="quote-icon">
            <i class="fa-solid fa-quote-left"></i>
        </div>

        <span id="categoryBadge">
            Motivation
        </span>

        <h2 id="quote">
            Your quote will appear here
        </h2>

        <p id="author">
            — Author
        </p>


        <!-- Main Button -->

        <button id="newQuoteBtn" class="new-quote">
            <i class="fa-solid fa-shuffle"></i>
            New Quote
        </button>


        <!-- Actions -->

        <div class="actions">

            <button id="favoriteBtn"
                    class="action-btn"
                    title="Add to favourites">

                <i class="fa-regular fa-heart"></i>

            </button>


            <button id="copyBtn"
                    class="action-btn"
                    title="Copy quote">

                <i class="fa-regular fa-copy"></i>

            </button>


            <button id="shareBtn"
                    class="action-btn"
                    title="Share quote">

                <i class="fa-solid fa-share-nodes"></i>

            </button>

        </div>

    </main>


    <!-- Favourite Counter -->

    <div class="stats">

        <div>
            <i class="fa-solid fa-heart"></i>

            <span id="favoriteCount">
                0
            </span>

            Favourite Quotes
        </div>

    </div>


    <!-- Favourite Quotes -->

    <section class="favorites-section">

        <div class="section-title">

            <div>
                <h2>My Favourites ❤️</h2>
                <p>Your saved inspiration</p>
            </div>

            <button id="clearFavorites">
                Clear All
            </button>

        </div>

        <div id="favoritesContainer"
             class="favorites-container">

            <p class="empty-message">
                No favourite quotes yet.
            </p>

        </div>

    </section>


    <footer>
        Made with ❤️ | CodeAlpha Internship
    </footer>

</div>


<!-- Toast Message -->

<div id="toast">
    Quote copied!
</div>


<script src="script.js"></script>

</body>
</html>
