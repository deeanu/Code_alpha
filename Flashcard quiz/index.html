<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashCard</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <div>
        <h1>FlashMaster</h1>
        <p>Learn smarter. Remember faster.</p>
    </div>

    <button id="themeBtn" class="icon-btn">🌙</button>
</header>


<!-- DASHBOARD -->

<section class="dashboard">

    <div class="stat">
        📚
        <h3 id="totalCards">0</h3>
        <p>Total Cards</p>
    </div>

    <div class="stat">
        ❤️
        <h3 id="favoriteCount">0</h3>
        <p>Favorites</p>
    </div>

    <div class="stat">
        ⭐
        <h3 id="difficultCount">0</h3>
        <p>Difficult</p>
    </div>

    <div class="stat">
        🏆
        <h3 id="score">0</h3>
        <p>Score</p>
    </div>

</section>


<!-- SEARCH -->

<section class="tools">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search flashcards..."
    >

    <select id="category">
        <option value="All">All Categories</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="JavaScript">JavaScript</option>
        <option value="General">General</option>
    </select>

    <button id="favoriteFilter">
        ❤️ Favorites
    </button>

    <button id="difficultFilter">
        ⭐ Difficult
    </button>

    <button id="shuffleBtn">
        🔀 Shuffle
    </button>

    <button id="quizBtn">
        🎯 Quiz Mode
    </button>

</section>


<!-- PROGRESS -->

<section class="progress-section">

    <div class="progress-top">
        <span id="progressText">Card 1 of 4</span>
        <span id="cardCount">4 Cards</span>
    </div>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

</section>


<!-- FLASHCARD -->

<main>

    <div class="flashcard">

        <span id="categoryBadge" class="badge">
            HTML
        </span>

        <h2 id="question">
            Question
        </h2>

        <div id="answerBox" class="answer hidden">
            <p id="answer"></p>
        </div>

        <div class="card-buttons">

            <button id="showAnswer">
                👁️ Show Answer
            </button>

            <button id="speakBtn" class="small-btn">
                🔊
            </button>

            <button id="favoriteBtn" class="small-btn">
                ❤️
            </button>

            <button id="difficultBtn" class="small-btn">
                ⭐
            </button>

        </div>

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <button id="prevBtn">
            ← Previous
        </button>

        <button id="nextBtn">
            Next →
        </button>

    </div>


    <!-- QUIZ -->

    <section id="quizBox" class="quiz-box hidden">

        <h2>🎯 Quiz Mode</h2>

        <div class="timer">
            ⏱️ <span id="timer">15</span>s
        </div>

        <h3 id="quizQuestion">
            Question
        </h3>

        <input
            type="text"
            id="quizAnswer"
            placeholder="Type your answer"
        >

        <button id="submitQuiz">
            Submit Answer
        </button>

        <p id="quizResult"></p>

    </section>


    <!-- MANAGE CARDS -->

    <section class="manager">

        <h2>Manage Flashcards</h2>

        <input
            type="text"
            id="questionInput"
            placeholder="Enter question"
        >

        <input
            type="text"
            id="answerInput"
            placeholder="Enter answer"
        >

        <select id="categoryInput">
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="General">General</option>
        </select>

        <div class="manage-buttons">

            <button id="addBtn">
                ➕ Add
            </button>

            <button id="editBtn">
                ✏️ Edit
            </button>

            <button id="deleteBtn">
                🗑️ Delete
            </button>

        </div>

    </section>

</main>


<div id="toast" class="toast"></div>


<script src="script.js"></script>

</body>
</html>
